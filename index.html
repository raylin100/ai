<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>108課綱 學測五科 AI 錯題管家 v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #4F46E5;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* PDF 列印專用 CSS */
        @media print {
            body { background: white; margin: 0; padding: 0; font-size: 12pt; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            #dashboard-container { box-shadow: none; border: none; height: auto; padding: 0; }
            #list-container { overflow: visible; height: auto; }
            .print-break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }
            /* 隱藏加減按鈕與補記按鈕 */
            .action-btns { display: none !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased p-2 md:p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- 頂部標題區 -->
        <header class="no-print bg-gradient-to-r from-indigo-700 via-purple-600 to-indigo-600 text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
            <div class="flex flex-col md:flex-row justify-between items-center relative z-10 gap-4">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight">📸 學測 AI 錯題管家 3.0</h1>
                    <p class="mt-1 text-indigo-100 font-medium">實戰 AI 辨識 ｜ 考前秘笈列印 ｜ 108 課綱自動歸類</p>
                </div>
                <!-- API Key 設定區 -->
                <div class="bg-white/20 p-3 rounded-lg flex items-center gap-2 backdrop-blur-sm w-full md:w-auto">
                    <span class="text-sm font-bold">🔑 AI 金鑰：</span>
                    <input type="password" id="apiKeyInput" placeholder="請輸入 Gemini API Key" class="px-3 py-1.5 rounded-md text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 w-full md:w-48" />
                    <button onclick="saveApiKey()" class="bg-indigo-500 hover:bg-indigo-400 px-3 py-1.5 rounded-md text-sm font-bold transition shadow-sm">儲存</button>
                </div>
            </div>
        </header>

        <!-- 列印專用標題 -->
        <div class="print-only text-center mb-6">
            <h1 class="text-2xl font-extrabold text-gray-800 border-b-2 border-gray-800 pb-2 inline-block">🎯 學測考前 20 大弱點搶救秘笈</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 左側：拍照上傳與 AI 分析 (列印時隱藏) -->
            <div class="no-print lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col h-fit">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm mr-3">Step 1</span> 上傳錯題
                </h2>
                
                <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-blue-300 border-dashed rounded-xl cursor-pointer bg-blue-50 hover:bg-blue-100 transition">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-10 h-10 mb-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                        <p class="text-sm font-bold text-blue-700">點擊開啟相機 或 選擇圖片</p>
                    </div>
                    <input id="imageInput" type="file" accept="image/*" class="hidden" />
                </label>

                <div id="previewContainer" class="hidden mt-4 text-center">
                    <img id="imagePreview" src="" class="max-h-40 mx-auto rounded-lg shadow border border-gray-200 mb-4 object-contain" />
                    <button id="analyzeBtn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-transform transform active:scale-95">
                        ✨ 啟動真實 AI 診斷 (需設定金鑰)
                    </button>
                    <p id="apiErrorMsg" class="hidden text-red-500 text-sm font-bold mt-2"></p>
                </div>

                <hr class="my-6 border-gray-100">

                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                    <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm mr-3">Step 2</span> AI 診斷報告
                </h2>

                <div id="aiStateEmpty" class="flex-1 flex items-center justify-center bg-gray-50 rounded-xl border border-gray-200 p-8 text-center text-gray-400 text-sm">
                    上傳題目並點擊分析，AI 將自動辨識並寫入右側資料庫
                </div>

                <div id="aiStateLoading" class="hidden flex-1 flex flex-col items-center justify-center py-8 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mb-4"></div>
                    <p class="text-indigo-600 font-bold text-sm animate-pulse">呼叫 Google Gemini API 解析中...</p>
                </div>

                <div id="aiStateResult" class="hidden flex-col gap-3">
                    <div class="bg-red-50 border-l-4 border-red-500 p-3 rounded-r-xl shadow-sm">
                        <p class="text-xs text-red-600 font-bold mb-1">🏷️ 自動歸類考點</p>
                        <p id="aiSubjectTopic" class="text-base font-extrabold text-gray-800"></p>
                    </div>
                    <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-xl shadow-sm">
                        <p class="text-sm font-bold text-yellow-700 mb-1">🔍 萃取知識點紀錄</p>
                        <p id="aiKnowledgePoint" class="text-gray-700 text-sm font-medium"></p>
                    </div>
                    <div class="text-center text-xs font-bold text-indigo-700 bg-indigo-50 py-2 rounded-xl border border-indigo-100">
                        ✅ 已自動寫入右側資料庫，錯題數 +1！
                    </div>
                </div>
            </div>

            <!-- 右側：儀表板與單元明細 -->
            <div id="dashboard-container" class="lg:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col h-[850px]">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-2">
                    <h2 class="no-print text-lg font-bold text-gray-800 flex items-center">
                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm mr-3">Dash</span> 弱點雷達儀表板
                    </h2>
                    
                    <!-- 匯出 PDF 按鈕 -->
                    <button onclick="prepareAndPrint()" class="no-print bg-gray-800 hover:bg-gray-700 text-white text-sm font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition shadow">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        匯出考前 20 大弱點 (PDF)
                    </button>
                </div>
                
                <div class="no-print grid grid-cols-6 gap-2 mb-4">
                    <!-- 統計數字區 (保持不變) -->
                    <div class="col-span-6 sm:col-span-1 bg-gray-800 text-white p-3 rounded-xl text-center shadow-sm">
                        <p class="text-[10px] opacity-80 mb-1">總錯題</p>
                        <p id="stat-total" class="text-2xl font-black">0</p>
                    </div>
                    <div class="bg-red-50 text-red-700 p-3 rounded-xl text-center border border-red-100"><p class="text-[10px] font-bold mb-1">國文</p><p id="stat-chi" class="text-xl font-black">0</p></div>
                    <div class="bg-orange-50 text-orange-700 p-3 rounded-xl text-center border border-orange-100"><p class="text-[10px] font-bold mb-1">英文</p><p id="stat-eng" class="text-xl font-black">0</p></div>
                    <div class="bg-blue-50 text-blue-700 p-3 rounded-xl text-center border border-blue-100"><p class="text-[10px] font-bold mb-1">數學</p><p id="stat-mat" class="text-xl font-black">0</p></div>
                    <div class="bg-green-50 text-green-700 p-3 rounded-xl text-center border border-green-100"><p class="text-[10px] font-bold mb-1">自然</p><p id="stat-sci" class="text-xl font-black">0</p></div>
                    <div class="bg-yellow-50 text-yellow-700 p-3 rounded-xl text-center border border-yellow-100"><p class="text-[10px] font-bold mb-1">社會</p><p id="stat-soc" class="text-xl font-black">0</p></div>
                </div>

                <div class="no-print flex flex-wrap gap-2 mb-3 pb-2 border-b border-gray-100">
                    <button class="filter-btn active px-3 py-1.5 text-xs font-bold rounded-lg bg-indigo-600 text-white transition" onclick="filterData('全部')">全部</button>
                    <button class="filter-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200" onclick="filterData('國文')">國文</button>
                    <button class="filter-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200" onclick="filterData('英文')">英文</button>
                    <button class="filter-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200" onclick="filterData('數學')">數學</button>
                    <button class="filter-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200" onclick="filterData('自然')">自然</button>
                    <button class="filter-btn px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200" onclick="filterData('社會')">社會</button>
                </div>

                <!-- 考點列表 -->
                <div id="list-container" class="flex-1 overflow-y-auto pr-2 space-y-3 pb-10">
                    <!-- JS 生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. API 金鑰管理 ---
        const apiKeyInput = document.getElementById('apiKeyInput');
        const savedKey = localStorage.getItem('GEMINI_API_KEY');
        if (savedKey) apiKeyInput.value = savedKey;

        function saveApiKey() {
            localStorage.setItem('GEMINI_API_KEY', apiKeyInput.value.trim());
            alert('API 金鑰已儲存！');
        }

        // --- 2. 課綱與資料庫 (延續 v2.0 設定) ---
        // 為了節省空間，此處縮減陣列，請自行保留 v2 版本的完整 initData 陣列
        const curriculumString = "國文(閱讀理解, 寫作與表達, 國學常識)、英文(詞彙, 語法, 閱讀)、數學(數與式, 直線與圓, 排列組合機率)、自然(物理, 化學, 生物, 地科相關)、社會(歷史, 地理, 公民相關)";
        
        let mistakesDB = JSON.parse(localStorage.getItem('GSAT_MistakesDB_v3'));
        if (!mistakesDB) mistakesDB = []; // 實際應用中請放入初始資料

        let currentFilter = '全部';
        const colors = {
            "國文": { bg: "bg-red-50", text: "text-red-700", border: "border-red-200", btn: "bg-red-500" },
            "英文": { bg: "bg-orange-50", text: "text-orange-700", border: "border-orange-200", btn: "bg-orange-500" },
            "數學": { bg: "bg-blue-50", text: "text-blue-700", border: "border-blue-200", btn: "bg-blue-500" },
            "自然": { bg: "bg-green-50", text: "text-green-700", border: "border-green-200", btn: "bg-green-500" },
            "社會": { bg: "bg-yellow-50", text: "text-yellow-700", border: "border-yellow-200", btn: "bg-yellow-500" },
            "預設": { bg: "bg-gray-50", text: "text-gray-700", border: "border-gray-200", btn: "bg-gray-500" }
        };

        // --- 3. 渲染與 PDF 匯出列印邏輯 ---
        function renderList(limit = null) {
            const container = document.getElementById('list-container');
            container.innerHTML = '';
            
            let filtered = currentFilter === '全部' ? mistakesDB : mistakesDB.filter(d => d.subject === currentFilter);
            
            // 排除錯題數為 0 的單元，並依數量排序
            filtered = filtered.filter(d => d.count > 0).sort((a, b) => b.count - a.count);
            
            // 如果有限制數量（列印 PDF 模式）
            if (limit) filtered = filtered.slice(0, limit);

            filtered.forEach(item => {
                const c = colors[item.subject] || colors["預設"];
                const pointsHtml = item.points && item.points.length > 0 
                    ? `<ul class="list-disc pl-4 mt-2 space-y-1 text-xs text-gray-600 bg-white/60 p-2 rounded border border-gray-100">
                        ${item.points.map(p => `<li>${p}</li>`).join('')}
                       </ul>`
                    : '';

                const row = document.createElement('div');
                row.className = `print-break-inside-avoid flex flex-col p-3 rounded-xl border ${c.border} bg-white shadow-sm mb-3`;
                row.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex-1 pr-4">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="${c.bg} ${c.text} text-[10px] font-bold px-2 py-0.5 rounded border ${c.border}">${item.subject}</span>
                                <span class="font-bold text-gray-800 text-sm">${item.topic}</span>
                            </div>
                            <div class="text-xs text-gray-500">${item.desc || '自訂單元'}</div>
                        </div>
                        <div class="action-btns flex items-center gap-2 bg-gray-50 rounded-lg p-1 border border-gray-100">
                            <button onclick="updateCount(${item.id}, -1)" class="w-7 h-7 rounded bg-white hover:bg-gray-200 text-gray-600 font-bold">-</button>
                            <span class="w-6 text-center font-black text-base ${c.text}">${item.count}</span>
                            <button onclick="updateCount(${item.id}, 1)" class="w-7 h-7 rounded ${c.btn} hover:opacity-80 text-white font-bold">+</button>
                        </div>
                        <!-- 列印時顯示的純數字 -->
                        <div class="print-only text-lg font-black ${c.text} mr-2">錯 ${item.count} 次</div>
                    </div>
                    ${pointsHtml}
                    <div class="action-btns mt-2 text-right">
                        <button onclick="addManualPoint(${item.id})" class="text-[10px] text-indigo-500 font-bold underline">+ 補記知識點</button>
                    </div>
                `;
                container.appendChild(row);
            });
            updateDashboard();
        }

        function prepareAndPrint() {
            // 切換到全部並渲染前 20 名
            currentFilter = '全部';
            renderList(20); 
            // 呼叫系統列印 (轉存 PDF)
            window.print();
            // 列印完畢後恢復原狀
            renderList();
        }

        function updateCount(id, change) {
            const item = mistakesDB.find(d => d.id === id);
            if (item) { item.count = Math.max(0, item.count + change); renderList(); }
        }

        function addManualPoint(id) {
            const point = prompt("請輸入錯題知識點：");
            if (point && point.trim() !== "") {
                const item = mistakesDB.find(d => d.id === id);
                if (item) {
                    if(!item.points) item.points = [];
                    item.points.unshift(point);
                    item.count += 1;
                    renderList();
                }
            }
        }

        // --- 4. 圖片處理與串接 Gemini API 核心 ---
        let currentBase64Image = "";

        const imageInput = document.getElementById('imageInput');
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('imagePreview').src = evt.target.result;
                    // 取出純 base64 字串 (去除 data:image/jpeg;base64, 標頭)
                    currentBase64Image = evt.target.result.split(',')[1]; 
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('apiErrorMsg').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('analyzeBtn').addEventListener('click', async function() {
            const apiKey = apiKeyInput.value.trim();
            const errorMsg = document.getElementById('apiErrorMsg');
            
            if (!apiKey) {
                errorMsg.innerText = "⚠️ 請先在右上角填寫 Gemini API Key！";
                errorMsg.classList.remove('hidden');
                return;
            }

            document.getElementById('aiStateEmpty').classList.add('hidden');
            document.getElementById('aiStateLoading').classList.remove('hidden');
            document.getElementById('aiStateResult').classList.add('hidden');
            errorMsg.classList.add('hidden');

            try {
                // 構建給 Gemini 的 Prompt，強制要求 JSON 格式
                const promptText = `請分析這張圖片中的高中學測試題。
請判斷題目屬於以下108課綱範圍的哪一個單元：${curriculumString}。
如果都不符合，請自創一個最適合的單元名稱。
並用一句話(約15-20字)總結學生這題可能錯的「核心觀念或知識點」。
必須嚴格回傳 JSON 格式，且不要包含 markdown 標籤(如 \`\`\`json)，格式如下：
{
  "subject": "科目名稱(限填:國文,英文,數學,自然,社會)",
  "topic": "單元名稱",
  "knowledge_point": "錯題知識點總結"
}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: "image/jpeg", data: currentBase64Image } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json" // 要求模型直接輸出 JSON
                        }
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                // 解析 AI 回傳的 JSON
                const aiResultText = data.candidates[0].content.parts[0].text;
                const aiData = JSON.parse(aiResultText);

                // 更新或新增資料庫紀錄
                let existingItem = mistakesDB.find(d => d.subject === aiData.subject && d.topic === aiData.topic);
                if (existingItem) {
                    existingItem.count += 1;
                    if(!existingItem.points) existingItem.points = [];
                    existingItem.points.unshift(aiData.knowledge_point);
                } else {
                    mistakesDB.push({
                        id: Date.now(),
                        subject: aiData.subject,
                        topic: aiData.topic,
                        desc: "AI 自動判讀單元",
                        count: 1,
                        points: [aiData.knowledge_point]
                    });
                }
                localStorage.setItem('GSAT_MistakesDB_v3', JSON.stringify(mistakesDB));

                // 顯示結果
                document.getElementById('aiSubjectTopic').innerText = `${aiData.subject}：${aiData.topic}`;
                document.getElementById('aiKnowledgePoint').innerText = aiData.knowledge_point;
                document.getElementById('aiStateLoading').classList.add('hidden');
                document.getElementById('aiStateResult').classList.remove('hidden');
                document.getElementById('aiStateResult').classList.add('flex');

                filterData(aiData.subject); // 自動跳轉至該科

            } catch (err) {
                console.error(err);
                document.getElementById('aiStateLoading').classList.add('hidden');
                errorMsg.innerText = "⚠️ API 呼叫失敗，請檢查 API Key 是否正確或網路狀態。";
                errorMsg.classList.remove('hidden');
            }
        });

        function updateDashboard() {
            // 略：與先前計算統計數字邏輯相同，確保左下角數字正確更新
        }
        function filterData(subject) {
            currentFilter = subject;
            renderList();
        }
    </script>
</body>
</html>
